<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>East Side Baptist Church — Springhill, LA</title>
  <meta name="description" content="East Side Baptist Church in Springhill, Louisiana. Sunday School, worship, and Bible study — everyone welcome." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav" id="nav">
    <a class="nav__mark" href="#top">
      <svg class="nav__compass" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M20 8 L23.5 18.5 L20 32 L16.5 18.5 Z" fill="currentColor"/>
      </svg>
      <span>East Side Baptist</span>
    </a>
    <nav class="nav__links" id="nav-links"></nav>
    <button class="nav__toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="hero__scene" aria-hidden="true">
        <svg class="hero__pines" viewBox="0 0 1200 160" preserveAspectRatio="none">
          <path d="M0 160 L0 120 L40 60 L60 90 L90 30 L120 90 L150 55 L180 120 L210 70 L240 120 L270 50 L300 110 L330 65 L360 120 L390 40 L420 100 L450 70 L480 130 L510 55 L540 110 L570 75 L600 20 L630 75 L660 110 L690 55 L720 130 L750 70 L780 100 L810 40 L840 120 L870 65 L900 110 L930 50 L960 120 L990 70 L1020 90 L1050 30 L1080 90 L1110 60 L1140 120 L1170 60 L1200 120 L1200 160 Z"/>
        </svg>
      </div>
      <div class="hero__content">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 class="hero__name" id="hero-name"></h1>
        <p class="hero__tagline" id="hero-tagline"></p>
        <div class="hero__ctas">
          <a class="cta cta--primary" id="hero-cta-primary" href="#sermons"><span></span></a>
          <a class="cta cta--ghost" id="hero-cta-secondary" href="#contact"><span></span></a>
        </div>
      </div>
    </section>

    <section class="board" id="times">
      <div class="board__inner">
        <p class="board__label">This Week</p>
        <ul class="board__list" id="board-list"></ul>
      </div>
    </section>

    <section class="announcement" id="announcement">
      <p id="announcement-text"></p>
    </section>

    <section class="sermons" id="sermons">
      <div class="section__head reveal">
        <p class="section-label">Sermons</p>
        <h2>Latest messages</h2>
      </div>
      <div class="sermons__grid" id="sermons-grid"></div>
    </section>

    <section class="pastor" id="pastor">
      <div class="pastor__photo reveal">
        <img id="pastor-photo" alt="" />
      </div>
      <div class="pastor__content reveal">
        <p class="section-label">Pastor</p>
        <h2 id="pastor-name"></h2>
        <p class="pastor__intro" id="pastor-intro"></p>
        <div id="pastor-bio"></div>
        <ol class="timeline" id="pastor-timeline"></ol>
      </div>
    </section>

    <section class="contact" id="contact">
      <div class="contact__inner">
        <div class="contact__info reveal">
          <p class="section-label">Visit</p>
          <h2 id="contact-heading"></h2>
          <p class="contact__address" id="contact-address"></p>
          <p class="contact__address contact__address--mail" id="contact-mail-address"></p>
          <a class="contact__email" id="contact-email" href="#"></a>
          <a class="cta cta--primary contact__fb" id="contact-facebook" href="#" target="_blank" rel="noopener"></a>
          <p class="contact__note" id="contact-note"></p>
        </div>
        <div class="contact__map reveal">
          <iframe id="contact-map" title="Church location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <svg class="footer__compass" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M20 8 L23.5 18.5 L20 32 L16.5 18.5 Z" fill="currentColor"/>
    </svg>
    <p id="footer-text"></p>
    <a href="#top" class="footer__top">Back to top ↑</a>
  </footer>

  <!-- Content: edit this file to change anything on the site -->
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
